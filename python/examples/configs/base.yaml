# Cutie 推理配置示例
#
# 用 cutie_cpp.CutieConfig.from_yaml() 加载：
#     config = cutie_cpp.CutieConfig.from_yaml("configs/base.yaml")
#
# 所有字段都可省略，省略时使用 dataclass 的默认值。

# ─── 模型 ────────────────────────────────────────────────────────────
# ONNX 子模块目录。留空（null）则自动搜索：
#   CUTIE_MODEL_DIR 环境变量 → 安装目录 share/cutie_cpp/model → 仓库 share/model
model_dir: null

# ONNX 文件名前缀。留空则从 model_dir 中的 *_pixel_encoder.onnx 自动推导
model_prefix: ""

# 模型变体：base（精度优先）| small（速度优先）
variant: base

# ─── 设备 ────────────────────────────────────────────────────────────
# 当前只支持 cuda；cpu 会在 validate() 阶段报错
device: cuda
device_id: 0

# 单目标模式优化。只跟踪一个目标时可置 true
single_object: false

# ─── 推理参数 ────────────────────────────────────────────────────────
# 动态分辨率下的短边像素上限。仅当模型为动态分辨率时生效；
# 固定分辨率模型会优先使用模型自身的输入尺寸。调小可提速、降显存
max_internal_size: 200

# 每 N 帧写入一次内存。值越大内存增长越慢，但可能漏掉关键帧
mem_every: 5

# 内存读取时的 top-K 亲和度选择。越大计算量越高
top_k: 30

# transformer 分块大小，-1 表示不分块
chunk_size: -1

# 把内存更新分摊到 N 帧，削平算力峰值
stagger_updates: 5

# ─── 工作内存 ────────────────────────────────────────────────────────
# 工作内存保留的最大帧数（FIFO）
max_mem_frames: 5

# ─── 长期内存 ────────────────────────────────────────────────────────
# 长期视频（数千帧）建议开启，用原型压缩抑制显存增长
use_long_term: false

long_term:
  # 是否统计使用频次用于原型选择
  count_usage: true
  # 触发整合前的最大帧数
  max_mem_frames: 10
  # 整合后保留的最小帧数
  min_mem_frames: 5
  # 原型聚类数量
  num_prototypes: 128
  # 长期内存的最大 token 数
  max_num_tokens: 10000
  # 整合时的缓冲 token 数，须小于 max_num_tokens
  buffer_tokens: 2000

# ─── 模型维度 ────────────────────────────────────────────────────────
# 由 variant 决定，只有使用自定义权重时才需要改动。
# 一般无需在配置文件中出现，此处列出仅作说明。
#
# model:
#   key_dim: 64
#   value_dim: 256
#   sensory_dim: 256
#   pixel_dim: 256
#   f16_dim: 1024
#   f8_dim: 512
#   f4_dim: 256
#   num_queries: 16
